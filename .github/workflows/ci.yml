name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: avatarstudio
          POSTGRES_PASSWORD: avatarstudio
          POSTGRES_DB: avatarstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avatarstudio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://avatarstudio:avatarstudio@localhost:5432/avatarstudio
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install ffmpeg and fonts (render pipeline)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Playwright browser
        run: pnpm --filter @avatarstudio/web exec playwright install --with-deps chromium

      - name: E2E (editor, Playwright)
        run: pnpm --filter @avatarstudio/web e2e
