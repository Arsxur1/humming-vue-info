services:
  # Всё приложение одной командой (нужен только Docker):
  #   docker compose --profile app up --build
  # Затем открыть http://localhost:5173
  app:
    build: .
    profiles: ['app']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://avatarstudio:avatarstudio@postgres:5432/avatarstudio
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: fs
      API_PUBLIC_URL: http://localhost:3001
    ports:
      - '5173:5173'
      - '3001:3001'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avatarstudio
      POSTGRES_PASSWORD: avatarstudio
      POSTGRES_DB: avatarstudio
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avatarstudio']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: avatarstudio
      MINIO_ROOT_PASSWORD: avatarstudio
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
