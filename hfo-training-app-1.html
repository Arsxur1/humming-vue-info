<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HFO · Humming Vue · Обучение №1</title>
<style>
  :root{
    --bg:#0A1628; --bg2:#0E1E36; --panel:#10233F; --panel2:#152C4D;
    --line:#1E3A5F; --line2:#27496f;
    --teal:#14B8A6; --teal-d:#0D9488; --lime:#A8F03C; --amber:#F59E0B;
    --blue:#3B82F6; --red:#F26D6D; --green:#34D399; --purple:#A78BFA;
    --txt:#E8EFF7; --mut:#94A3B8; --mut2:#64748B;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --sans:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--txt);font-family:var(--sans);
    line-height:1.55;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;background:
    radial-gradient(1100px 700px at 80% -10%, rgba(20,184,166,.10), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(168,240,60,.07), transparent 55%),
    var(--bg)}
  .num,.mono{font-family:var(--mono)}
  .wrap{max-width:920px;margin:0 auto;padding:0 18px}
  sub{font-size:.7em}

  /* ---------- Header ---------- */
  header{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);
    background:rgba(10,22,40,.82);border-bottom:1px solid var(--line)}
  .hbar{display:flex;align-items:center;gap:12px;height:58px}
  .brand{display:flex;align-items:center;gap:9px;cursor:pointer;font-weight:800;letter-spacing:.5px}
  .brand .wave{width:30px;height:18px;flex:0 0 auto}
  .brand b{color:var(--txt);font-size:15px}
  .brand .prod{color:var(--lime);font-size:11px;font-family:var(--mono);letter-spacing:1.5px}
  .grow{flex:1}
  .langs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:3px}
  .langs button{background:none;border:none;color:var(--mut);font-family:var(--mono);
    font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;cursor:pointer;letter-spacing:.5px}
  .langs button.on{background:var(--teal);color:#04121f}

  /* ---------- Nav tabs ---------- */
  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:var(--panel);
    border:1px solid var(--line);color:var(--mut);font-weight:700;font-size:13px;
    padding:8px 13px;border-radius:11px;cursor:pointer;transition:.15s;white-space:nowrap}
  .tab:hover{border-color:var(--line2);color:var(--txt)}
  .tab.on{background:linear-gradient(180deg,var(--panel2),var(--panel));
    border-color:var(--teal);color:var(--txt);box-shadow:0 0 0 1px rgba(20,184,166,.25)}
  .tab .ic{font-size:15px}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

  main{padding:18px 0 80px;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:var(--teal);font-weight:700}
  h1.title{font-size:clamp(26px,5.5vw,40px);line-height:1.08;font-weight:800;margin:10px 0 12px;letter-spacing:-.5px}
  h1 .ac{color:var(--lime)}
  .sub{color:var(--mut);font-size:15px;max-width:640px}
  h2.sec{font-size:22px;font-weight:800;margin:4px 0 14px;letter-spacing:-.3px}
  .accent{color:var(--teal)}

  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:16px;padding:18px}
  .grid{display:grid;gap:12px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}

  /* ---------- Home ---------- */
  .hero{text-align:left;padding:8px 0 6px}
  .wavebig{height:54px;margin:14px 0 18px}
  .modcard{position:relative;overflow:hidden;cursor:pointer;transition:.18s;
    background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:16px;padding:18px 18px 16px}
  .modcard:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 14px 34px -18px rgba(20,184,166,.6)}
  .modcard .mic{font-size:26px}
  .modcard h3{font-size:17px;font-weight:800;margin:9px 0 5px}
  .modcard p{color:var(--mut);font-size:13.5px}
  .modcard .meta{margin-top:12px;display:flex;align-items:center;gap:8px;font-family:var(--mono);
    font-size:11px;color:var(--mut2)}
  .pill{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.5px;
    padding:3px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--mut)}
  .pill.done{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.5);color:var(--green)}
  .progress{height:7px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:11px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--lime));border-radius:999px;transition:width .5s}

  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#04121f;
    border:none;font-family:var(--sans);font-weight:800;font-size:14px;padding:11px 18px;
    border-radius:11px;cursor:pointer;transition:.15s}
  .btn:hover{background:#19cdb9;transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line2)}
  .btn.ghost:hover{border-color:var(--teal);background:rgba(20,184,166,.08)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

  /* ---------- Lessons ---------- */
  .lessonnav{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .lchip{background:var(--panel);border:1px solid var(--line);color:var(--mut);font-family:var(--mono);
    font-size:12px;font-weight:700;width:34px;height:34px;border-radius:9px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.15s}
  .lchip:hover{border-color:var(--line2);color:var(--txt)}
  .lchip.on{background:var(--teal);color:#04121f;border-color:var(--teal)}
  .lchip.seen{border-color:rgba(52,211,153,.5);color:var(--green)}
  .lessonbody h3{font-size:20px;font-weight:800;margin:0 0 4px}
  .lessonbody .lead{color:var(--txt);font-size:15.5px;margin:12px 0}
  .lessonbody p{color:var(--mut);margin:11px 0;font-size:14.5px}
  .lessonbody b{color:var(--txt)}
  .keybox{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--lime);
    border-radius:10px;padding:13px 15px;margin:14px 0}
  .keybox .kl{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--lime);font-weight:700;text-transform:uppercase}
  .keybox ul{margin:8px 0 0;padding-left:18px}
  .keybox li{margin:5px 0;color:var(--txt);font-size:14px}
  .warn{background:rgba(242,109,109,.09);border:1px solid rgba(242,109,109,.32);
    border-radius:10px;padding:11px 14px;margin:13px 0;font-size:13.5px;color:#ffd9d9}
  .warn b{color:#ffb4b4}
  .formula{font-family:var(--mono);background:var(--bg2);border:1px solid var(--line2);
    border-radius:9px;padding:10px 14px;display:inline-block;margin:8px 0;color:var(--teal);font-weight:600;font-size:15px}

  /* ---------- Test ---------- */
  .qcard{margin-bottom:14px}
  .qhead{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);
    font-size:11px;color:var(--mut2);margin-bottom:10px;letter-spacing:1px}
  .qtext{font-size:16.5px;font-weight:700;margin-bottom:14px}
  .opt{display:flex;align-items:flex-start;gap:11px;background:var(--bg2);border:1px solid var(--line);
    border-radius:11px;padding:12px 14px;margin:8px 0;cursor:pointer;transition:.12s;font-size:14.5px}
  .opt:hover{border-color:var(--line2)}
  .opt .mk{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);
    font-family:var(--mono);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--mut)}
  .opt.sel{border-color:var(--teal);background:rgba(20,184,166,.10)}
  .opt.sel .mk{border-color:var(--teal);background:var(--teal);color:#04121f}
  .opt.correct{border-color:var(--green);background:rgba(52,211,153,.12)}
  .opt.correct .mk{border-color:var(--green);background:var(--green);color:#04121f}
  .opt.wrong{border-color:var(--red);background:rgba(242,109,109,.12)}
  .opt.wrong .mk{border-color:var(--red);background:var(--red);color:#fff}
  .opt.lock{cursor:default}
  .explain{font-size:13px;color:var(--mut);margin-top:10px;padding-left:2px;border-left:2px solid var(--line2);padding-left:11px}
  .explain b{color:var(--teal)}

  .result{text-align:center;padding:26px 18px}
  .scorebig{font-family:var(--mono);font-size:58px;font-weight:700;line-height:1}
  .scorebig.pass{color:var(--green)} .scorebig.fail{color:var(--amber)}
  .badge{display:inline-block;margin:14px 0 6px;font-family:var(--mono);font-weight:700;
    font-size:13px;letter-spacing:1px;padding:8px 18px;border-radius:999px}
  .badge.pass{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.5)}
  .badge.fail{background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.5)}

  /* ---------- Scenarios ---------- */
  .scn .tagrow{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 4px}
  .stag{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 9px;border-radius:999px}
  .stag.oxy{background:rgba(59,130,246,.15);color:#8fbcff;border:1px solid rgba(59,130,246,.4)}
  .stag.vent{background:rgba(245,158,11,.15);color:#ffce80;border:1px solid rgba(245,158,11,.4)}
  .stag.alarm{background:rgba(242,109,109,.15);color:#ffb4b4;border:1px solid rgba(242,109,109,.4)}
  .scn .vitals{display:flex;gap:14px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);
    border-radius:11px;padding:12px 14px;margin:12px 0;font-family:var(--mono)}
  .vit{display:flex;flex-direction:column}
  .vit .vk{font-size:9px;color:var(--mut2);letter-spacing:1px}
  .vit .vv{font-size:17px;font-weight:600;color:var(--txt)}
  .vit .vv.bad{color:var(--amber)}

  /* ---------- Flashcards ---------- */
  .deck{display:grid;gap:12px}
  @media(min-width:620px){.deck{grid-template-columns:1fr 1fr}}
  .flip{perspective:1200px;height:150px;cursor:pointer}
  .flipin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
  .flip.on .flipin{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:15px;padding:16px;
    display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line)}
  .front{background:linear-gradient(180deg,var(--panel2),var(--panel))}
  .front .ic{font-size:26px;margin-bottom:8px}
  .front .q{font-weight:800;font-size:16px}
  .front .hint{margin-top:auto;font-family:var(--mono);font-size:10px;color:var(--mut2);letter-spacing:1px}
  .back{background:linear-gradient(180deg,#0c2238,#0a1c30);transform:rotateY(180deg);border-color:var(--teal)}
  .back .a{font-size:14px;color:var(--txt)}
  .back .a b{color:var(--lime)}

  /* ---------- Mistakes ---------- */
  .mcard{margin-bottom:12px}
  .mnum{font-family:var(--mono);font-size:13px;color:var(--teal);font-weight:700}
  .mpair{display:grid;gap:10px;margin:10px 0}
  @media(min-width:620px){.mpair{grid-template-columns:1fr 1fr}}
  .mdo,.mdont{border-radius:11px;padding:12px 14px;font-size:14px}
  .mdo{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.32)}
  .mdont{background:rgba(242,109,109,.08);border:1px solid rgba(242,109,109,.32)}
  .ml{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;margin-bottom:5px}
  .mdo .ml{color:var(--green)} .mdont .ml{color:var(--red)}
  .mwhy{font-size:13px;color:var(--mut);background:var(--bg2);border-radius:10px;padding:10px 13px}
  .mwhy b{color:var(--teal);font-family:var(--mono);font-size:10px;letter-spacing:1px;display:block;margin-bottom:4px;text-transform:uppercase}

  footer{border-top:1px solid var(--line);margin-top:40px;padding:18px 0;color:var(--mut2);
    font-family:var(--mono);font-size:11px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  footer .dot{opacity:.5}
  .disc{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);border-radius:10px;
    padding:10px 13px;margin-top:14px;font-size:11.5px;color:#ffce80;font-family:var(--mono);line-height:1.5}

  /* ---------- Completion banner + references ---------- */
  .done100{background:linear-gradient(135deg,rgba(52,211,153,.16),rgba(168,240,60,.10));
    border:1px solid rgba(52,211,153,.5);border-radius:14px;padding:16px 18px;margin-top:18px;
    font-weight:700;color:#cfeede;display:flex;gap:10px;align-items:center}
  details.refs{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
  details.refs summary{cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:1px;
    color:var(--teal);font-weight:700;padding:12px 0;list-style:none;text-transform:uppercase}
  details.refs summary::-webkit-details-marker{display:none}
  details.refs summary::before{content:"▸ ";color:var(--mut2)}
  details.refs[open] summary::before{content:"▾ "}
  details.refs .rnote{color:var(--mut);font-size:12.5px;margin:2px 0 8px}
  details.refs ol{margin:0 0 14px 18px;padding:0}
  details.refs li{color:var(--mut);font-size:12px;margin:7px 0;line-height:1.45}

  /* ---------- Simulator ---------- */
  .simwrap{display:grid;gap:14px}
  @media(min-width:720px){.simwrap{grid-template-columns:1.05fr .95fr}}
  .screen{background:#06101e;border:1px solid var(--teal-d);border-radius:14px;padding:14px;
    box-shadow:inset 0 0 40px rgba(13,148,136,.12)}
  .scrtop{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);
    font-size:10px;letter-spacing:1.5px;color:var(--teal);margin-bottom:8px}
  .scrtop .live{display:flex;align-items:center;gap:6px}
  .scrtop .ld{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.4s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  canvas#osc{display:block;width:100%;height:120px;background:#040b15;border-radius:9px;border:1px solid var(--line)}
  .readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .rd{background:#0a1726;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .rd .rk{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--mut2);text-transform:uppercase}
  .rd .rv{font-family:var(--mono);font-size:21px;font-weight:600;line-height:1.1;margin-top:2px}
  .rd .ru2{font-size:11px;color:var(--mut)}
  .knobs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .knob{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:13px;padding:12px}
  .knob .kl2{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
  .knob .kval{font-family:var(--mono);font-size:25px;font-weight:700;margin:4px 0 9px;display:flex;align-items:baseline;gap:5px}
  .knob .ku{font-size:12px;color:var(--mut)}
  .kbtns{display:flex;gap:8px}
  .kbtns button{flex:1;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);
    font-size:20px;font-weight:700;border-radius:9px;padding:5px 0;cursor:pointer;transition:.12s;font-family:var(--mono)}
  .kbtns button:hover{border-color:var(--teal);background:rgba(20,184,166,.12)}
  .kbtns button:active{transform:scale(.94)}
  .simhint{margin-top:12px;border-radius:11px;padding:12px 14px;font-size:14px;display:flex;gap:9px;align-items:flex-start}
  .simhint .hi{font-size:17px;flex:0 0 auto}
  .simhint.ok{background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.4);color:#bff3dd}
  .simhint.warn{background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.4);color:#ffdca0}
  .simtask{font-size:12.5px;color:var(--mut);font-family:var(--mono);background:var(--bg2);
    border-left:3px solid var(--teal);border-radius:8px;padding:9px 12px;margin-bottom:14px;line-height:1.5}

  /* ---------- Certificate ---------- */
  .cert{background:linear-gradient(135deg,#0c2238,#0a1830);border:2px solid var(--teal);
    border-radius:18px;padding:30px 26px;text-align:center;position:relative;overflow:hidden;margin-top:6px}
  .cert::before{content:"";position:absolute;inset:0;background:
    radial-gradient(500px 200px at 50% -20%,rgba(168,240,60,.10),transparent 70%);pointer-events:none}
  .cert-wave{color:var(--teal);font-family:var(--mono);letter-spacing:4px;opacity:.5;font-size:14px}
  .cert-seal{font-size:34px;margin:4px 0}
  .cert-title{font-family:var(--mono);letter-spacing:7px;font-size:15px;color:var(--lime);font-weight:700;margin-top:4px}
  .cert-awarded{color:var(--mut);font-size:13px;margin:14px 0 8px}
  .cert-name{background:transparent;border:none;border-bottom:2px dashed var(--line2);color:var(--txt);
    font-family:var(--sans);font-weight:800;font-size:26px;text-align:center;padding:4px 8px;width:100%;max-width:420px;outline:none}
  .cert-name:focus{border-color:var(--teal)}
  .cert-body{color:var(--mut);font-size:13px;margin:12px 0 4px}
  .cert-course{font-weight:800;font-size:17px;color:var(--txt)}
  .cert-meta{display:flex;justify-content:center;gap:22px;margin-top:18px;font-family:var(--mono);
    font-size:12px;color:var(--mut)}
  .cert-meta b{color:var(--teal)}
  .cert-brand{margin-top:18px;font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--mut2)}

  @media print{
    body{background:#fff}
    header,footer,nav,.tabs,.no-print,.btnrow{display:none!important}
    body *{visibility:hidden}
    #cert,#cert *{visibility:visible}
    #cert{position:absolute;left:0;right:0;top:30px;margin:auto;max-width:680px;
      background:#fff;border-color:#0D9488;color:#0a1628}
    #cert .cert-title{color:#0D9488}#cert .cert-name,#cert .cert-course{color:#0a1628}
    #cert .cert-awarded,#cert .cert-body,#cert .cert-meta{color:#475569}
  }
</style>
</head>
<body>
<header>
  <div class="wrap hbar">
    <div class="brand" onclick="go('home')">
      <svg class="wave" viewBox="0 0 60 30"><path d="M2 15 Q8 2 14 15 T26 15 T38 15 T50 15 T58 15" fill="none" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/></svg>
      <div><b>HUMMING VUE</b> <span class="prod">HFO · ОБУЧЕНИЕ №1</span></div>
    </div>
    <div class="grow"></div>
    <div class="langs" id="langs"></div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs"></nav></div>
</header>

<main><div class="wrap" id="view"></div></main>

<script>
/* =========================================================================
   HFO · Humming Vue · Обучающее приложение №1
   Автономный однофайловый учебный модуль. Без внешних зависимостей.
   Контент основан на материалах руководства Humming Vue (HFO) из репозитория.
   ========================================================================= */

/* ---------- i18n: интерфейс ---------- */
const UI = {
  ru:{
    nav:{home:"Главная",lessons:"Уроки",simulator:"Тренажёр",test:"Тест",scenarios:"Сценарии",cards:"Карточки",mistakes:"Ошибки"},
    heroEye:"Учебный курс · для врачей и медсестёр ОРИТН",
    heroTitle:["Высокочастотная вентиляция","за 30 минут."],
    heroSub:"Полный курс по работе на аппарате Metran Humming Vue в режиме HFO: короткие уроки, тест с оценкой, клинические сценарии, карточки и разбор типичных ошибок. Прогресс сохраняется в этом браузере.",
    start:"Начать обучение",
    reset:"Сбросить прогресс",

  en:[
    {t:"What HFO is — the \"hummingbird\"",lead:"HFO is not \"regular ventilation, only faster\". It is a different way to make lungs work.",
     body:["A hovering hummingbird beats its wings <b>50–80 times per second</b>. The wings barely move — they vibrate. That is enough to stay airborne.",
     "HFO is the same: instead of big breaths, tiny oscillations <b>up to 15 times per second</b>. Alveoli are micro-balloons. On conventional ventilation we inflate and deflate them each cycle. On HFO we <b>keep them inflated</b> and gently shake them.",

    {t:"HFO versus conventional ventilation",lead:"The key difference is what happens to the alveolus.",

     key:["CMV: inflate–deflate, large volumes, trauma risk","HFO: hold open + micro-oscillations","Lower peak pressure → less lung injury"]},
    {t:"Indications — when to choose HFO",lead:"HFO is a different tool for specific tasks, not just the \"next step\".",

     "<b>PPHN</b> — pulmonary hypertension, often with iNO: a stable MAP opens the capillary bed.",

     "<b>Rescue</b> — after CMV failure (FiO₂ > 60% and MAP > 12)."],
     key:["RDS, MAS, PPHN, Air leak, CDH, Rescue","Covers 95% of real NICU cases","Switch from CMV before injury, not after"]},
    {t:"Four settings and four auto-readouts",lead:"On the Humming Vue you control four parameters on the right and read four readouts on the left.",

     "<b>You read (left, automatic):</b> ΔA — amplitude, measured MAP, V_hfo — oscillatory tidal volume, DCO₂ — CO₂ clearance index.",
     "The device's key trait: you turn <b>SV, not amplitude</b>. Amplitude ΔP/ΔA is a consequence of SV. A 13-µm precision piston delivers volume by a volumetric principle — accurately, regardless of compliance."],
     key:["Settings: SV · MAP · f · FiO₂","Readouts: ΔA · MAP · V_hfo · DCO₂","Turn SV (0.2 mL step); amplitude follows"],
     formula:"DCO₂ = V_hfo² × f"},
    {t:"Starting a patient: 4 steps",lead:"Four steps, strictly in order. Don't skip.",
     body:["<b>1. Optimise MAP.</b> Set MAP 1–2 cmH₂O above the CMV value. Raise by 1 cm every 2–3 min until SpO₂ improves, then lower by 1 cm until SpO₂ starts to drop — the \"opening point\". Set MAP 2 cm above it.",
     "<b>2. Frequency (f).</b> Neonates 10–15 Hz; under 1 yr 8–10; older 6–8; adults 3–5. The smaller the patient, the higher the frequency. Frequency is changed rarely.",
     "<b>3. Stroke Volume (SV).</b> Start at 2 mL/kg (or 1.2–1.4 mL/kg with hypocapnia/spontaneous breathing), step 0.2 mL. Aim for visible chest wobble down to the navel. Gases at 20–30 min.",
     "<b>4. FiO₂ and check.</b> Start 90–100%, wean by 5%. Target: SpO₂ 90–95% at FiO₂ < 60%. At 30 min — X-ray (8–9 ribs) and gases."],

     warn:"Too high a MAP → overdistension → impaired perfusion → desaturation. Too low → atelectasis."},
    {t:"Monitoring: what to watch",lead:"Don't trust the numbers alone or the eye alone — read them together.",
     body:["<b>Eye:</b> visible chest vibration down to the navel signals adequate V_hfo.",
     "<b>Screen:</b> rising DCO₂ with adequate V_hfo are the best CO₂-clearance indicators. <b>DCO₂ = V_hfo² × f</b> — note the volume is squared, so it matters more than frequency.",
     "<b>Blood gases:</b> draw at 20–30 minutes. Earlier — not equilibrated; later — you miss decompensation.",
     "<b>Alarm:</b> if ΔA rises while V_hfo and DCO₂ fall sharply to zero — critical: blocked ETT or disconnection. Suction immediately."],
     key:["Chest vibrates down to the navel","DCO₂ = V_hfo² × f — volume beats frequency","Gases at 20–30 min, not sooner"],
     formula:"DCO₂ = V_hfo² × f",
     warn:"ΔA ↑ + V_hfo/DCO₂ → 0 = blocked ETT → suction immediately."},
    {t:"Correction and weaning",lead:"First decide: is the problem oxygenation (O₂) or ventilation (CO₂)?",
     body:["<b>Oxygenation (SpO₂):</b> adjust MAP and FiO₂. MAP comes first — find the opening point. Low SpO₂: ↑ MAP by 1–2 cm, then ↑ FiO₂.",
     "<b>Ventilation (CO₂):</b> adjust SV first. Hypercapnia (high CO₂): ↑ SV by 0.5–1 mL; if SV is maxed — ↓ f by 1 Hz (lower frequency → larger volume → higher DCO₂). Hypocapnia: ↓ SV (target V_hfo 1.2–1.4 mL/kg).",
     "<b>Weaning:</b> lower FiO₂ by 5% first, only then MAP by 1 cm. Never the other way — a sudden MAP drop collapses alveoli and you start over.",
     "<b>Golden rule:</b> change one thing at a time, or you won't know what helped."],
     key:["O₂ → MAP & FiO₂ · CO₂ → SV (and f)","Lowering f raises DCO₂ (volume grows)","Wean FiO₂ first, MAP later, in small steps"],

    {do:"Снижать FiO₂ первым при отучении",dont:"Сразу резко снижать MAP",why:"Резкое падение MAP → коллапс альвеол → всё начинай сначала."}
  ],
  en:[
    {do:"Set MAP by the opening point — min to max, then back",dont:"Copy MAP from CMV — it will be too low",why:"On HFO lungs are kept open continuously. Too low a MAP → poor compliance; too high → overdistension → impaired perfusion → desaturation."},
    {do:"Change one thing at a time",dont:"Turn MAP, SV and f all at once",why:"Otherwise you won't know which change helped and which harmed."},
    {do:"Watch the chest and V_hfo / DCO₂",dont:"Rely on numbers alone or the eye alone",why:"Visible vibration to the navel + rising DCO₂ are the best indicators of adequate function."},
    {do:"Blood gases at 20–30 minutes",dont:"At 5 minutes or after an hour",why:"Earlier — not equilibrated; later — you miss decompensation."},
    {do:"Sedation, and paralysis if needed",dont:"Fight the patient's active breathing",why:"Spontaneous breaths on HFO disrupt the whole physiology of the method."},
    {do:"Lower FiO₂ first when weaning",dont:"Drop MAP sharply straight away",why:"A sudden MAP drop → alveolar collapse → start all over again."}
  ],
  uz:[
    {do:"MAP ni «ochilish nuqtasi» bo‘yicha qo‘yish — mindan maksgacha, so‘ng orqaga",dont:"MAP ni CMV dan ko‘chirish — kam bo‘ladi",why:"HFO da o‘pka doimo ochiq ushlanadi. MAP juda past → yomon komplayens; juda yuqori → ortiqcha cho‘zilish → perfuziya buzilishi → desaturatsiya."},
    {do:"Bir vaqtda bitta narsani o‘zgartirish",dont:"MAP, SV va f ni birvarakayiga burash",why:"Aks holda qaysi o‘zgarish yordam berdi-yu, qaysi biri zarar qildi — bilmaysiz."},
    {do:"Ko‘krakka va V_hfo / DCO₂ ga qarash",dont:"Faqat raqamlarga yoki faqat ko‘zga tayanish",why:"Kindikgacha tebranish + DCO₂ ortishi — yetarli ishning eng yaxshi ko‘rsatkichlari."},
    {do:"Qon gazlari 20–30 daqiqada",dont:"5 daqiqada yoki bir soatdan keyin",why:"Ertaroq — tizim muvozanatga kelmagan; kechroq — dekompensatsiyani o‘tkazib yuborasiz."},
    {do:"Sedatsiya, kerak bo‘lsa mioplegiya",dont:"Bemorning faol nafasiga qarshi kurashish",why:"HFO da mustaqil nafaslar usulning butun fiziologiyasini buzadi."},
    {do:"Fitimdan chiqarishda avval FiO₂ ni pasaytirish",dont:"Darrov MAP ni keskin tushirish",why:"MAP keskin tushishi → alveolalar yopilishi → hammasini qaytadan boshlash."}
  ]
};

/* ---------- Simulator model ---------- */
const SIM_DEF={sv:6.0, map:12, f:10, fio2:40, weight:3.0};
const SIM_STEP={sv:0.2, map:1, f:1, fio2:5, weight:0.5};
const SIM_MIN={sv:0.2, map:3, f:5, fio2:21, weight:0.5};
const SIM_MAX={sv:20, map:40, f:17, fio2:100, weight:5};
let simState=Object.assign({},SIM_DEF);
let simRaf=null;
function simCompute(){
  const s=simState;
  const vhfo=Math.max(0.05, s.sv*(1.05-0.012*s.f));   // учебная модель: ↓f → ↑объём
  const dco2=Math.round(vhfo*vhfo*s.f);               // DCO₂ = V_hfo² × f
  const dA=Math.round(s.sv*3.7);                       // амплитуда ~ следствие SV
  const perkg=vhfo/s.weight;
  return {vhfo,dco2,dA,perkg,mapM:s.map};
}
function simHint(c){
  const s=simState;
  if(s.map<6)  return ["mapLow","warn","⚠"];
  if(s.map>16) return ["mapHigh","warn","⚠"];
  if(c.perkg<1.2) return ["low","warn","↓"];
  if(c.perkg>2.2) return ["high","warn","↑"];
  return ["ok","ok","✓"];
}

function t(){return UI[lang];}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

/* progress model */

function setProg(p){store.set("prog",p);}
function moduleStatus(){
  const p=getProg();
  return {
    lessons: p.lessons.length>=LESSONS[lang].length,
    simulator: !!(p.done&&p.done.simulator),
    test: p.testBest!==null && p.testBest>=80,
    scenarios: (p.scn||[]).length>=SCEN[lang].length,
    cards: !!(p.done&&p.done.cards),
    mistakes: !!(p.done&&p.done.mistakes)
  };
}
function overallPct(){
  const s=moduleStatus();const arr=[s.lessons,s.simulator,s.test,s.scenarios,s.cards,s.mistakes];
  return Math.round(arr.filter(Boolean).length/arr.length*100);
}

          ${knob('map','MAP · cmH₂O','var(--teal)')}

function simClamp(key){simState[key]=Math.min(SIM_MAX[key],Math.max(SIM_MIN[key],Math.round(simState[key]/SIM_STEP[key])*SIM_STEP[key]));}
function simAdj(key,dir){simState[key]=simState[key]+dir*SIM_STEP[key];simClamp(key);markDone('simulator');simRefresh();}
function simReset(){Object.assign(simState,SIM_DEF);simRefresh();}
function simRefresh(){
  const s=simState;const c=simCompute();
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  set('v_sv',s.sv.toFixed(1));set('v_map',Math.round(s.map));set('v_f',Math.round(s.f));
  set('v_fio2',Math.round(s.fio2));set('v_weight',s.weight.toFixed(1));
  set('v_vhfo',c.vhfo.toFixed(1));set('v_perkg',c.perkg.toFixed(1));
  set('v_dco2',c.dco2);set('v_dA',c.dA);set('v_mapM',c.mapM);
  const[hk,cls,ic]=simHint(c);
  const hint=document.getElementById('simhint');
  if(hint){hint.className='simhint '+cls;
    const ht=document.getElementById('simhinttext');if(ht)ht.textContent=t().sim.hint[hk];
    const hi=hint.querySelector('.hi');if(hi)hi.textContent=ic;}
}
function simStop(){if(simRaf){cancelAnimationFrame(simRaf);simRaf=null;}}
function simStart(){
  simStop();
  const cv=document.getElementById('osc');if(!cv)return;
  const ctx=cv.getContext('2d');const dpr=window.devicePixelRatio||1;
  function size(){cv.width=Math.max(1,cv.clientWidth*dpr);cv.height=Math.max(1,cv.clientHeight*dpr);}
  size();
  const t0=performance.now();
  function frame(now){
    if(view!=='simulator'){simStop();return;}
    if(cv.clientWidth*dpr!==cv.width)size();
    const w=cv.width,h=cv.height,s=simState;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle='#13294a';ctx.lineWidth=1*dpr;
    ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
    const amp=Math.min(h*0.42,(s.sv/12)*h*0.42);
    const cycles=s.f, tt=(now-t0)/1000;
    ctx.strokeStyle='#14B8A6';ctx.lineWidth=2*dpr;ctx.shadowColor='#14B8A6';ctx.shadowBlur=6*dpr;
    ctx.beginPath();
    for(let x=0;x<=w;x+=2*dpr){
      const ph=(x/w)*cycles*Math.PI*2 - tt*s.f*0.9;
      const y=h/2 - Math.sin(ph)*amp;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();ctx.shadowBlur=0;
    simRaf=requestAnimationFrame(frame);
  }
  simRaf=requestAnimationFrame(frame);
}

function viewScenarios(){

  const vit=S.vit.map(v=>`<div class="vit"><span class="vk">${v[0]}</span><span class="vv ${v[2]?'bad':''}">${v[1]}</span></div>`).join("");
  const picked=state.scnAns;
  const opts=S.o.map((o,oi)=>{
    let cls="opt";
    if(picked!==null){cls+=" lock";if(oi===S.a)cls+=" correct";else if(picked===oi)cls+=" wrong";}
    else if(picked===oi)cls+=" sel";
    return `<div class="${cls}" onclick="${picked===null?`pickScn(${oi})`:''}">
      <span class="mk">${"ABCD"[oi]}</span><span>${esc(o)}</span></div>`;
  }).join("");
  const fb = picked!==null ? `<div class="explain"><b>${picked===S.a?'✓ '+t().correctLbl:'✗ '+t().wrongLbl}.</b> ${esc(S.e)}</div>`:'';
  const last=i===sc.length-1;
  return `
    <div class="eyebrow">${t().scnTitle} · ${i+1}/${sc.length}</div>
    <h2 class="sec">${t().scnSub}</h2>
    <div class="card scn">
      <div class="tagrow"><span class="stag ${S.tag}">${esc(S.tagL)}</span></div>
      <p style="font-size:15.5px;margin:6px 0 2px">${esc(S.sit)}</p>
      <div class="vitals">${vit}</div>
      <div style="font-weight:800;margin:6px 0 4px">${t().scnQ}</div>
      ${opts}${fb}
    </div>
    ${picked!==null?`<div class="btnrow">
      ${last?`<button class="btn" onclick="go('home')">${t().scnDone} ✓</button>`
            :`<button class="btn" onclick="nextScn()">${t().scnNext}</button>`}
    </div>`:''}`;
}
function pickScn(oi){
  state.scnAns=oi;
  const p=getProg();p.scn=p.scn||[];if(!p.scn.includes(state.scnIdx)){p.scn.push(state.scnIdx);setProg(p);}
  renderChrome();render();
}
function nextScn(){state.scnIdx=Math.min(SCEN[lang].length-1,state.scnIdx+1);state.scnAns=null;window.scrollTo(0,0);render();}

function viewCards(){
  const cs=CARDS[lang];
  markDone('cards');
  const deck=cs.map((c,i)=>`
    <div class="flip" id="flip${i}" onclick="document.getElementById('flip${i}').classList.toggle('on')">
      <div class="flipin">
        <div class="face front"><div class="ic">${c.ic}</div><div class="q">${esc(c.q)}</div>
          <div class="hint">${lang==='ru'?'нажми →':lang==='uz'?'bosing →':'tap →'}</div></div>
        <div class="face back"><div class="a">${c.a}</div></div>
      </div>
    </div>`).join("");
  return `
    <div class="eyebrow">${t().cardsTitle}</div>
    <h2 class="sec">${t().cardsSub}</h2>
    <div class="deck">${deck}</div>`;
}

function viewMistakes(){
  const ms=MIST[lang];markDone('mistakes');
  const cards=ms.map((m,i)=>`
    <div class="card mcard">
      <div class="mnum">${String(i+1).padStart(2,"0")}</div>
      <div class="mpair">
        <div class="mdo"><div class="ml">✓ ${t().do}</div>${esc(m.do)}</div>
        <div class="mdont"><div class="ml">✗ ${t().dont}</div>${esc(m.dont)}</div>
      </div>
      <div class="mwhy"><b>${t().why}</b>${esc(m.why)}</div>
    </div>`).join("");
  return `
    <div class="eyebrow">${t().mistTitle}</div>
    <h2 class="sec">${t().mistSub}</h2>
    ${cards}`;
}
function markDone(k){const p=getProg();p.done=p.done||{};if(!p.done[k]){p.done[k]=true;setProg(p);setTimeout(renderChrome,0);}}

function resetProg(){
  if(!confirm(lang==='ru'?'Сбросить весь прогресс обучения?':lang==='uz'?'Butun o‘quv natijasini tozalansinmi?':'Reset all training progress?'))return;
  store.set("prog",{lessons:[],testBest:null,scn:[],done:{}});
  state.lesson=0;state.scnIdx=0;state.scnAns=null;state.quizAns={};state.quizDone=false;
  go('home');
}

/* ---------- router ---------- */
function render(){
  renderChrome();
  const el=document.getElementById("view");
  const map={home:viewHome,lessons:viewLessons,simulator:viewSimulator,test:viewTest,scenarios:viewScenarios,cards:viewCards,mistakes:viewMistakes};
  el.innerHTML=(map[view]||viewHome)();
  if(view==='simulator') simStart(); else simStop();
}
/* keyboard: ←/→ перелистывают уроки */
window.addEventListener('keydown',function(e){
  if(view!=='lessons')return;
  if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  const last=LESSONS[lang].length-1;
  if(e.key==='ArrowRight'&&state.lesson<last){markSeen(state.lesson);setLesson(state.lesson+1);}
  else if(e.key==='ArrowLeft'&&state.lesson>0){setLesson(state.lesson-1);}
});

render();
/* footer */
(function(){
  const m=document.querySelector("main");
  const f=document.createElement("footer");f.className="";
  function paint(){f.innerHTML=`<div class="wrap" style="display:flex;gap:8px;flex-wrap:wrap"><span>${t().footer}</span><span class="dot">·</span><span>Tashkent · 2026</span><span class="dot">·</span><span>swanston.uz</span></div>`;}
  paint();m.appendChild(f);
  const _r=render;window.render=function(){_r();paint();};
})();
</script>
</body>
</html>
